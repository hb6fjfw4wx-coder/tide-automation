title: PowerShell Download Cradle Execution
id: 8f1b7c3e-2d4a-4e6b-9c1f-5a7d3e9b2c40
status: experimental
description: Detects PowerShell combining a web download method with in-memory execution, a common loader pattern.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Stefan Mocanu
date: 2026-09-27
tags:
  - attack.execution
  - attack.t1059.001
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_download:
    CommandLine|contains:
      - 'Net.WebClient'
      - 'DownloadString('
      - 'DownloadData('
      - 'Invoke-WebRequest'
      - 'Invoke-RestMethod'
      - 'Start-BitsTransfer'
  selection_exec:
    CommandLine|contains:
      - 'IEX'
      - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
  - Admin or software deployment scripts that bootstrap from internal repositories
level: high
